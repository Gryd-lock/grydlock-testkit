name: Consumer Contract Test (grydlock-oracle-adapter)

# Verifies that grydlock-oracle-adapter's StubOracle can still load this
# repo's current scores.json/destinations.json without error. Not run on
# every push (that would be a hard cross-repo CI coupling) - only on a
# schedule and manual dispatch, so a breaking fixture change is caught
# before a release rather than blocking every unrelated PR.
#
# See "Consumer Contract Test" in README.md for how to bump ORACLE_ADAPTER_REF.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC

env:
  # Pinned commit of Gryd-lock/grydlock-oracle-adapter to test against.
  # Bump this periodically (see README.md) - it will not track main
  # automatically.
  ORACLE_ADAPTER_REF: 7e5b1b09860ce713abe507a59a3b7a226e09ebfb

jobs:
  stub-oracle-contract-test:
    name: StubOracle loads this repo's current fixtures
    runs-on: ubuntu-latest
    steps:
      - name: Checkout grydlock-testkit
        uses: actions/checkout@v4
        with:
          path: testkit

      - name: Checkout grydlock-oracle-adapter (pinned ref)
        uses: actions/checkout@v4
        with:
          repository: Gryd-lock/grydlock-oracle-adapter
          ref: ${{ env.ORACLE_ADAPTER_REF }}
          path: oracle-adapter

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install grydlock-oracle-adapter dependencies
        working-directory: oracle-adapter
        run: npm ci

      # Consume the fixtures exactly as published: from the npm tarball, not
      # the working tree, so a file missing from package.json "files" fails here.
      - name: Pack grydlock-testkit
        working-directory: testkit
        run: |
          npm pack
          mkdir -p ../testkit-pkg && tar -xzf grydlock-testkit-*.tgz -C ../testkit-pkg

      - name: Point StubOracle at this repo's current fixtures
        run: |
          cp testkit-pkg/package/scores.json oracle-adapter/src/fixtures/testkit/scores.json
          cp testkit-pkg/package/destinations.json oracle-adapter/src/fixtures/testkit/destinations.json
          # The adapter loads fixtures through generated *.text.ts modules
          # when its ref has them; regenerate so the test sees the new data.
          if [ -f oracle-adapter/scripts/generate-fixture-text.mjs ]; then
            (cd oracle-adapter && node scripts/generate-fixture-text.mjs)
          fi

      - name: Write consumer contract test
        run: |
          cat > oracle-adapter/tests/testkit-consumer-contract.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest';
          import { StubOracle } from '../src/StubOracle';
          import { destinations } from '../src/fixtures/testkit';

          // Contract asserted here: for every destination currently published
          // in grydlock-testkit's destinations.json, StubOracle.getScore()
          // must resolve to a finite number in [0, 100] without throwing.
          // grydlock-testkit's schema.ts validation (run at module load,
          // see src/fixtures/testkit/index.ts) is what would actually throw
          // first if scores.json/destinations.json's shape changed
          // incompatibly - this test exists to catch that at the point the
          // testkit fixtures change, not later when it breaks downstream.
          describe('grydlock-testkit consumer contract', () => {
            it("loads every destination in grydlock-testkit's current destinations.json", async () => {
              const oracle = new StubOracle();
              expect(destinations.destinations.length).toBeGreaterThan(0);

              for (const destination of destinations.destinations) {
                const score = await oracle.getScore(destination.id);
                expect(typeof score).toBe('number');
                expect(Number.isFinite(score)).toBe(true);
                expect(score).toBeGreaterThanOrEqual(0);
                expect(score).toBeLessThanOrEqual(100);
              }
            });
          });
          EOF

      - name: Run consumer contract test
        working-directory: oracle-adapter
        run: npx vitest run tests/testkit-consumer-contract.test.ts

  package-consumer:
    name: Packed tarball resolves the way grydlock-extension uses it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: testkit
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pack grydlock-testkit
        working-directory: testkit
        run: npm pack --pack-destination ..
      - name: Install the tarball into a scratch consumer
        run: |
          mkdir consumer && cd consumer && npm init -y >/dev/null
          npm install ../grydlock-testkit-*.tgz
      - name: Resolve fixtures like grydlock-extension's demo server and the ESM loaders
        working-directory: consumer
        run: |
          cat > check.cjs <<'EOF'
          // Mirrors grydlock-extension/demo/server.mjs: require.resolve the
          // index, then read <id>.xdr for ids matching /^[a-z_]+$/.
          const fs = require('node:fs');
          const path = require('node:path');
          const indexPath = require.resolve('grydlock-testkit/transactions/index.json');
          const index = JSON.parse(fs.readFileSync(indexPath, 'utf8'));
          for (const f of index.fixtures) {
            const id = path.basename(f.file, '.xdr');
            if (!/^[a-z_]+$/.test(id)) throw new Error(`id ${id} is not servable by the extension demo`);
            const xdr = fs.readFileSync(path.join(path.dirname(indexPath), `${id}.xdr`), 'utf8').trim();
            if (!xdr) throw new Error(`${id}.xdr is empty`);
          }
          for (const f of ['destinations.json', 'scores.json']) require.resolve(`grydlock-testkit/${f}`);
          console.log(`ok: ${index.fixtures.length} transaction fixtures resolvable`);
          EOF
          node check.cjs
          node --input-type=module -e "import * as t from 'grydlock-testkit'; const d = t.loadDestinations().destinations; const s = t.loadScores(); if (!d.every((x) => x.id in s)) throw new Error('score missing'); console.log('ok: v' + t.datasetVersion, d.length, 'destinations')"
